<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Lane — музыка скоро будет звучать." />
    <title>Lane — скоро</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Geist, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
        color: #f4f4f4;
        --muted: #929296;
        --panel: #1a1a1c;
        --line: #363639;
        --accent: #ff4d4d;
      }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; background: #000; }
      main { display: flex; min-height: 100svh; flex-direction: column; padding: 16px 20px 20px; }
      .pause-mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 50%;
        background: #f1f1f2;
        color: #090909;
      }
      .pause-mark svg { width: 19px; height: 19px; fill: currentColor; }
      h1 { margin: 13px 0 7px; font-size: clamp(48px, 8.2vw, 72px); line-height: .98; letter-spacing: -.065em; font-weight: 650; }
      p { max-width: 440px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; letter-spacing: -.015em; }
      .player {
        display: flex;
        width: min(100%, 960px);
        min-height: 48px;
        align-items: center;
        gap: 14px;
        margin-top: auto;
        padding: 0 16px;
        border: 1px solid rgba(255,255,255,.04);
        border-radius: 12px;
        background: var(--panel);
      }
      .controls { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; }
      .control { display: grid; width: 13px; height: 24px; place-items: center; padding: 0; border: 0; background: transparent; color: #8b8b8f; }
      .control svg { width: 13px; height: 13px; fill: currentColor; }
      .time { flex: 0 0 auto; color: #d3d3d5; font-size: 10px; font-variant-numeric: tabular-nums; }
      .progress { position: relative; height: 3px; flex: 1; overflow: hidden; border-radius: 999px; background: #454549; }
      .progress::before { width: 0; height: 100%; background: var(--accent); content: ""; }
      .volume { display: grid; width: 18px; height: 22px; flex: 0 0 auto; place-items: center; color: #9a9a9d; }
      .volume svg { width: 14px; height: 14px; fill: currentColor; }
      .eyebrow { margin-top: 14px; color: #626267; font-size: 10px; letter-spacing: .14em; }
      @media (max-width: 560px) {
        main { padding: 16px 16px 18px; }
        h1 { margin-top: 17px; font-size: clamp(43px, 12vw, 62px); }
        p { max-width: 350px; font-size: 13px; }
        .desktop-break { display: none; }
        .player { min-height: 46px; gap: 10px; padding: 0 12px; }
        .controls { gap: 8px; }
        .eyebrow { margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="title">
        <span class="pause-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM15 5h4v14h-4z" /></svg>
        </span>
        <h1 id="title">Пока тишина.</h1>
        <p>Плеер ещё в разработке. Скоро здесь заиграет<br class="desktop-break" /> музыка.</p>
      </section>
      <div class="player" role="group" aria-label="Плеер Lane — скоро">
        <span class="controls" aria-hidden="true">
          <span class="control"><svg viewBox="0 0 24 24"><path d="M5 5v14h2V5H5zm14 1.5L9 12l10 5.5v-11z" /></svg></span>
          <span class="control"><svg viewBox="0 0 24 24"><path d="M8 5.8c0-.78.85-1.26 1.52-.86l10.08 6.2a1 1 0 0 1 0 1.72l-10.08 6.2A1 1 0 0 1 8 18.2V5.8Z" /></svg></span>
          <span class="control"><svg viewBox="0 0 24 24"><path d="M17 5v14h2V5h-2zM5 6.5v11L15 12 5 6.5z" /></svg></span>
        </span>
        <span class="time">0:00</span>
        <span class="progress" aria-hidden="true"></span>
        <span class="volume" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6l-5 4H3zm12.5 2a3.5 3.5 0 0 0-2-3.16v6.31a3.5 3.5 0 0 0 2-3.15zm-2-8.65v2.06a7 7 0 0 1 0 13.18v2.06a9 9 0 0 0 0-17.3z" /></svg></span>
      </div>
      <footer class="eyebrow">LANE MUSIC PLAYER</footer>
    </main>
  </body>
</html>
