# Builds Lane for Linux (AppImage for any distro, .deb, .rpm, .tar.gz) and
# Windows (installer, portable .exe, .zip) and publishes them as one GitHub
# Release with the tag `releases` ("Release Version X.Y.Z").
#
# How to use:
#   * push a tag such as v1.0.1          -> packages are built and the release is replaced;
#   * or Actions ▸ Release ▸ Run workflow -> same, from the selected branch.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages for .rpm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm exec tsc -b && pnpm exec vitest run
      - name: Build
        run: pnpm exec vite build && pnpm exec electron-builder --linux --x64 --publish never
      - name: Checksums
        run: cd release && sha256sum *.AppImage *.deb *.rpm *.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 1
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/SHA256SUMS-linux.txt

  windows:
    name: Windows packages
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Windows 11 snap animation add-on; the app falls back without it
      - name: Native add-on (optional)
        continue-on-error: true
        run: pnpm native:build
      - name: Build
        run: pnpm exec vite build && pnpm exec electron-builder --win --x64 --publish never
      - name: Checksums
        shell: bash
        run: cd release && sha256sum *.exe *.zip > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 1
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS-windows.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Web build for Android
        run: LANE_TARGET=android pnpm exec vite build --outDir dist-android
      - name: PO token script for the Android app
        run: pnpm build:potoken
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      - name: Build signed APK
        env:
          LANE_KEYSTORE_B64: ${{ secrets.LANE_KEYSTORE_B64 }}
          LANE_KEYSTORE_PASSWORD_SECRET: ${{ secrets.LANE_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export LANE_VERSION_NAME="$VERSION"
          export LANE_VERSION_CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          # the signing key: repository secrets if set, else the one kept in the private repo
          if [ -n "$LANE_KEYSTORE_B64" ]; then
            echo "$LANE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lane.jks"
            export LANE_KEYSTORE_FILE="$RUNNER_TEMP/lane.jks"
            export LANE_KEYSTORE_PASSWORD="$LANE_KEYSTORE_PASSWORD_SECRET"
          else
            export LANE_KEYSTORE_FILE="$GITHUB_WORKSPACE/android/keystore/lane-release.jks"
            export LANE_KEYSTORE_PASSWORD="$(cat android/keystore/lane-release.password)"
          fi
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/Lane-$VERSION.apk"
          cd ../release && sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          retention-days: 1
          path: |
            release/*.apk
            release/SHA256SUMS-android.txt

  publish:
    name: Publish release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Replace the `releases` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete releases --yes --cleanup-tag || true
          git push origin :refs/tags/releases || true
          gh release create releases dist-release/* \
            --target "$GITHUB_SHA" \
            --title "Release Version $VERSION" \
            --notes-file .github/RELEASE_NOTES.md \
            --latest
