# Builds Lane for Linux, Windows, macOS (Intel / Apple Silicon) and Android
# and publishes all packages as one GitHub
# Release with the tag `releases` ("Release Version X.Y.Z").
#
# How to use:
# * push a tag such as v1.0.1 -> packages are built and the release is replaced;
# * or Actions ▸ Release ▸ Run workflow -> same, from the selected branch.
#
# No workflow artifacts: every build uploads its files straight into a draft
# release (release assets don't count toward the Actions storage quota). The
# draft replaces the `releases` release only once every build has succeeded,
# so a failed run leaves the previous release untouched.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRAFT_TAG: releases-next

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # a draft left over from an earlier failed run
          gh release delete "$DRAFT_TAG" --yes || true
          gh release create "$DRAFT_TAG" --draft \
            --target "$GITHUB_SHA" \
            --title "Release Version $VERSION" \
            --notes-file .github/RELEASE_NOTES.md

  linux:
    name: Linux packages
    needs: [prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages for .rpm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Build
        run: pnpm exec vite build && pnpm exec electron-builder --linux --x64 --publish never
      - name: Verify updater metadata
        run: test -f release/latest-linux.yml
      - name: Checksums
        run: |
          cp release/*.AppImage release/Lane-latest.AppImage
          cp release/*.deb release/lane-latest_amd64.deb
          cd release && sha256sum *.AppImage *.deb *.rpm *.tar.gz > SHA256SUMS-linux.txt
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$DRAFT_TAG" release/latest-linux.yml release/*.AppImage release/*.deb release/*.rpm release/*.tar.gz release/SHA256SUMS-linux.txt --clobber

  windows:
    name: Windows packages
    needs: [prepare]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Windows 11 snap animation add-on; the app falls back without it
      - name: Native add-on (optional)
        continue-on-error: true
        run: pnpm native:build
      - name: Build
        run: pnpm exec vite build && pnpm exec electron-builder --win --x64 --publish never
      - name: Verify updater metadata
        shell: bash
        run: test -f release/latest.yml
      - name: Checksums
        shell: bash
        run: |
          cp release/Lane-Setup-*.exe release/Lane-latest-setup.exe
          cd release && sha256sum *.exe *.zip > SHA256SUMS-windows.txt
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$DRAFT_TAG" release/latest.yml release/*.exe release/*.zip release/SHA256SUMS-windows.txt --clobber

  macos:
    name: macOS packages (Intel and Apple Silicon)
    needs: [prepare]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build DMG and ZIP for both architectures
        run: pnpm exec vite build && pnpm exec electron-builder --mac --x64 --arm64 --publish never
      - name: Verify updater metadata and create checksums
        run: |
          test -f release/latest-mac.yml
          VERSION=$(node -p "require('./package.json').version")
          cp "release/Lane-$VERSION-arm64.dmg" release/Lane-latest-arm64.dmg
          cp "release/Lane-$VERSION-x64.dmg" release/Lane-latest-x64.dmg
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "$DRAFT_TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/SHA256SUMS-macos.txt --clobber

  android:
    name: Android signed APK
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build Android interface and token helper
        run: |
          LANE_TARGET=android pnpm exec vite build --outDir dist-android
          pnpm build:potoken
          pnpm exec cap sync android
      - name: Build signed APK
        env:
          LANE_KEYSTORE_B64: ${{ secrets.LANE_KEYSTORE_B64 }}
          LANE_KEYSTORE_PASSWORD_SECRET: ${{ secrets.LANE_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export LANE_VERSION_NAME="$VERSION"
          export LANE_VERSION_CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          if [ -n "$LANE_KEYSTORE_B64" ]; then
            echo "$LANE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lane.jks"
            export LANE_KEYSTORE_FILE="$RUNNER_TEMP/lane.jks"
            export LANE_KEYSTORE_PASSWORD="$LANE_KEYSTORE_PASSWORD_SECRET"
          else
            export LANE_KEYSTORE_FILE="$GITHUB_WORKSPACE/android/keystore/lane-release.jks"
            export LANE_KEYSTORE_PASSWORD="$(cat android/keystore/lane-release.password)"
          fi
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/Lane-$VERSION.apk"
          cd ../release
          cp "Lane-$VERSION.apk" Lane-latest.apk
          sha256sum *.apk > SHA256SUMS-android.txt
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$DRAFT_TAG" release/*.apk release/SHA256SUMS-android.txt --clobber

  publish:
    name: Publish release
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the `releases` release with the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete releases --yes --cleanup-tag || true
          git push origin :refs/tags/releases || true
          gh release edit "$DRAFT_TAG" --tag releases --target "$GITHUB_SHA" --draft=false --latest
